# CI — validation uniquement. Ce workflow NE DÉPLOIE JAMAIS d'infrastructure
# ni de modèle ; voir .github/workflows/cd.yml pour la promotion dev → prod.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Vérification de types (mypy)
        run: mypy components tools

      - name: Tests (unit, integration, components)
        run: pytest tests/unit tests/integration components/ -v

      - name: Scan des dépendances (pip-audit)
        run: |
          pip install pip-audit
          # CVE-2026-71211 : SSRF dans l'AI Gateway du serveur/UI MLflow
          # (mlflow/server/gateway_api.py) — ce starter kit n'utilise que
          # l'API client (mlflow.start_run/log_metrics/autolog,
          # mlflow.sklearn.save_model/load_model) via azureml-mlflow vers le
          # tracking Azure ML managé ; ni `mlflow server` ni `mlflow ui` ne
          # sont exécutés. Pas de version corrigée disponible à ce jour
          # (mlflow 3.15.2, la dernière connue, reste concernée). À retirer
          # dès qu'un correctif existe — revérifier avec `pip-audit` sans
          # cette exclusion de temps en temps.
          #
          # PYSEC-2026-3552 (cryptography, transitive via azure-identity) :
          # corrigé en 50.0.0, mais mlflow==3.15.0 exige explicitement
          # cryptography<50,>=43.0.0 (ResolutionImpossible constaté en
          # local) — impossible de corriger sans casser mlflow. La faille ne
          # touche que le déchiffrement PKCS#7/S-MIME
          # (pkcs7_decrypt_der/pem/smime), jamais utilisé dans ce repo. Voir
          # pyproject.toml pour le détail. À retirer dès que mlflow relève
          # son plafond cryptography.
          pip-audit --skip-editable \
            --ignore-vuln CVE-2026-71211 \
            --ignore-vuln PYSEC-2026-3552

  yaml-validate:
    name: YAML Azure ML CLI v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer PyYAML
        run: pip install pyyaml

      - name: Valider les schémas Azure ML
        run: python tools/validate_yaml.py

  terraform-validate:
    name: Terraform — fmt, validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (sans backend distant)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: tfsec (optionnel, non bloquant)
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true
        with:
          working_directory: infrastructure/terraform

  secrets-scan:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        # Binaire gitleaks en direct plutôt que gitleaks/gitleaks-action@v2 :
        # cette action exige désormais une licence payante (GITLEAKS_LICENSE)
        # pour les comptes organisation (voir
        # https://github.com/gitleaks/gitleaks-action#-announcement). Le
        # binaire open-source reste gratuit et couvre le même besoin (scan +
        # échec du job si un secret est détecté).
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose
