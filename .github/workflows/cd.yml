# CD — promotion dev → prod en une seule chaîne, déclenchée après un CI vert
# sur main (ou manuellement). Deux environnements seulement (pas de staging) :
# prod n'est déployé qu'après les tests smoke de dev, et jamais
# automatiquement — l'environnement GitHub "production" doit avoir une règle
# d'approbation manuelle (Settings > Environments) qui met le job en pause
# jusqu'à validation humaine.
#
# Authentification Azure : OIDC fédéré (azure/login avec client-id/tenant-id/
# subscription-id) — aucun secret client stocké dans le dépôt ou les secrets
# GitHub. Voir docs/SECURITY.md.
#
# State Terraform : backend distant (Azure Storage), obligatoire dès qu'une
# CI est impliquée — sans ça, chaque run partirait d'un state vide sur un
# runner éphémère et recréerait des ressources en doublon. Storage account
# provisionné une seule fois via `make bootstrap-tfstate` (voir
# infrastructure/terraform/README.md) ; son nom (pas un secret en soi) est
# stocké en variable de repo GitHub (Settings > Secrets and variables >
# Actions > Variables), pas en secret : TF_STATE_RESOURCE_GROUP,
# TF_STATE_STORAGE_ACCOUNT, TF_STATE_CONTAINER. Authentification au backend
# par Azure AD (`use_azuread_auth=true`, même identité OIDC que azure/login
# ci-dessous) — aucune clé de storage account requise.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Déployer — dev
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=house-price-prediction-dev.tfstate" \
            -backend-config="use_azuread_auth=true"
      - run: terraform apply -auto-approve -var-file=../../environments/dev.tfvars

  validate-dev:
    name: Valider — dev (smoke tests)
    needs: deploy-dev
    runs-on: ubuntu-latest
    # Même environnement que deploy-dev : la fédération OIDC (azure/login) est
    # configurée pour lui, et l'endpoint batch s'authentifie par Entra ID.
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Job de scoring batch réel : plusieurs minutes (démarrage de cpu-cluster).
      - name: Tests smoke
        run: pytest tests/smoke/ -v
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.DEV_AZURE_RESOURCE_GROUP }}
          AZUREML_WORKSPACE_NAME: ${{ vars.DEV_AZUREML_WORKSPACE_NAME }}
          BATCH_ENDPOINT_NAME: ml-project-batch-endpoint

  deploy-prod:
    name: Déployer — production
    needs: validate-dev
    runs-on: ubuntu-latest
    # Règle d'approbation manuelle requise sur cet environnement
    # (Settings > Environments > production > Required reviewers) —
    # jamais de déploiement automatique en production sans validation humaine.
    environment: production
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=house-price-prediction-prod.tfstate" \
            -backend-config="use_azuread_auth=true"
      - run: terraform apply -auto-approve -var-file=../../environments/prod.tfvars
