# CD — promotion dev → prod, déclenchée après un CI vert sur main (ou
# manuellement). Chaque environnement est déployé de bout en bout par
# deploy-env.yml : infra, entraînement, enregistrement du modèle, déploiement
# batch et test smoke.
#
# Deux environnements seulement (pas de staging). Prod n'est déployé qu'après
# la réussite complète de dev (test smoke compris), et jamais automatiquement :
# l'environnement GitHub "production" doit avoir une règle d'approbation
# manuelle (Settings > Environments > production > Required reviewers), qui
# met le job en pause jusqu'à validation humaine.
#
# Configuration GitHub requise (Settings > Secrets and variables > Actions >
# onglet Variables — ce ne sont pas des secrets) :
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID : identité OIDC de
#     la CD (identité managée, voir docs/CUSTOMIZATION_GUIDE.md §19) ;
#   TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT, TF_STATE_CONTAINER :
#     storage du state Terraform (mêmes valeurs que environments/backend-*.hcl).
# Environnements GitHub à créer : "dev" et "production" (noms exacts : ce sont
# eux que les federated credentials OIDC autorisent).
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

# Jamais deux déploiements en parallèle sur les mêmes environnements (state
# Terraform verrouillé, endpoint partagé).
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  dev:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-env.yml
    with:
      tf_env: dev
      github_environment: dev

  prod:
    needs: dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      tf_env: prod
      github_environment: production
