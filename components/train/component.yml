# TEMPLATE: customize for client
# ------------------------------------------------------------------------
# Composant Azure ML CLI v2 — entraînement du modèle.
# Une seule responsabilité : entraîner le modèle retenu dans
# notebooks/01_Exploration.ipynb (choix et hyperparamètres dans
# src/model_config.json) et l'écrire au format MLflow.
#
# Référence Microsoft officielle :
# https://learn.microsoft.com/azure/machine-learning/how-to-log-mlflow-models
$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: train
display_name: "Entraînement du modèle"
version: 1
type: command
description: >-
  Entraîne le pipeline complet (feature engineering, prétraitement, modèle,
  transformation de la cible) décrit dans src/model_config.json et l'écrit au
  format MLflow. Le modèle prend en entrée les 8 colonnes brutes.

inputs:
  train_data:
    type: uri_folder
    description: "Jeu d'entraînement (sortie de data_prep)."

outputs:
  model_output:
    type: mlflow_model
    description: "Modèle entraîné, au format MLflow."

code: ./src

# TEMPLATE: optional
environment: azureml:ml-project-training-env@latest

command: >-
  python main.py
  --train_data ${{inputs.train_data}}
  --model_output ${{outputs.model_output}}
