# TEMPLATE: customize for client
# ------------------------------------------------------------------------
# Composant Azure ML CLI v2 — contrôle de qualité avant enregistrement.
# Une seule responsabilité : laisser passer le modèle vers sa sortie si (et
# seulement si) il respecte les seuils de RMSE et de MAPE, et échouer sinon.
# L'enregistrement dans le registre (en MLFLOW) est fait après le pipeline
# par scripts/bootstrap-project.sh (étape 8), avec l'identité de celui qui le lance : le
# code n'appelle pas le SDK, et l'identité du compute n'a besoin d'aucun rôle.
#
# Référence Microsoft officielle :
# https://learn.microsoft.com/azure/machine-learning/how-to-manage-inputs-outputs-pipeline
$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: register_model
display_name: "Contrôle qualité et enregistrement du modèle"
version: 2
type: command
description: >-
  Vérifie que le modèle respecte les seuils de RMSE et de MAPE sur le jeu de
  test, puis le transmet à sa sortie, que le script de bootstrap enregistre
  ensuite en MLFLOW. Échoue (et rien n'est enregistré) si un seuil n'est
  pas respecté.

inputs:
  model_input:
    type: mlflow_model
    description: "Modèle entraîné (sortie de train)."
  evaluation_report:
    type: uri_folder
    description: "Rapport d'évaluation (sortie de evaluate)."
  rmse_threshold:
    type: number
    description: >-
      RMSE maximale acceptée (en centaines de milliers de $). 0.5 = 50 000 $
      d'écart typique sur la valeur médiane d'un district.
    default: 0.5
  mape_threshold_pct:
    type: number
    description: >-
      MAPE maximale acceptée, en %. 20 = estimation en moyenne à moins de
      20 % de la valeur réelle d'un district.
    default: 20

outputs:
  model_output:
    type: mlflow_model
    description: "Modèle accepté (n'existe que si le gate réussit), enregistré en MLFLOW par scripts/bootstrap-project.sh (étape 8)."

code: ./src

# TEMPLATE: optional
environment: azureml:ml-project-training-env@latest

command: >-
  python main.py
  --model_input ${{inputs.model_input}}
  --evaluation_report ${{inputs.evaluation_report}}
  --rmse_threshold ${{inputs.rmse_threshold}}
  --mape_threshold_pct ${{inputs.mape_threshold_pct}}
  --model_output ${{outputs.model_output}}
