# TEMPLATE: customize for client
# ------------------------------------------------------------------------
# Composant Azure ML CLI v2 — enregistrement conditionnel du modèle.
# Une seule responsabilité : enregistrer le modèle dans le Model Registry
# Azure ML si (et seulement si) sa RMSE ne dépasse pas un seuil maximal.
#
# Référence Microsoft officielle :
# https://learn.microsoft.com/azure/machine-learning/how-to-manage-models
$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: register_model
display_name: "Enregistrement du modèle"
version: 1
type: command
description: >-
  Enregistre le modèle dans le Model Registry Azure ML uniquement si sa RMSE
  sur le jeu de test est inférieure ou égale au seuil (gating).

inputs:
  model_input:
    type: mlflow_model
    description: "Modèle entraîné (sortie de train)."
  evaluation_report:
    type: uri_folder
    description: "Rapport d'évaluation (sortie de evaluate)."
  model_name:
    type: string
    description: "Nom sous lequel enregistrer le modèle dans le registre."
    default: house-price-model
  rmse_threshold:
    type: number
    description: >-
      RMSE maximale acceptée (en centaines de milliers de $). 0.5 = 50 000 $
      d'écart typique sur la valeur médiane d'un district.
    default: 0.5

code: ./src

# TEMPLATE: optional
environment: azureml:ml-project-training-env@latest

command: >-
  python main.py
  --model_input ${{inputs.model_input}}
  --evaluation_report ${{inputs.evaluation_report}}
  --model_name ${{inputs.model_name}}
  --rmse_threshold ${{inputs.rmse_threshold}}
