# Exemple d'endpoint batch (inférence différée sur de gros volumes).
#
# Référence Microsoft officielle :
# https://learn.microsoft.com/azure/machine-learning/how-to-use-batch-endpoint
#
# Création :
#   az ml batch-endpoint create --file ml/endpoints/batch/batch-endpoint.yml \
#     --resource-group <rg> --workspace-name <workspace>
$schema: https://azuremlschemas.azureedge.net/latest/batchEndpoint.schema.json
# Nom de BASE : scripts/bootstrap-project.sh y ajoute l'environnement
# (house-price-batch-dev, house-price-batch-prod). Le nom sert à construire
# l'adresse https://<nom>.<région>.inference.ml.azure.com, qui doit être
# unique dans toute la région Azure : deux workspaces ne peuvent pas avoir
# un endpoint du même nom.
name: house-price-batch
description: "Estimation de la valeur médiane des logements de chaque district (California Housing), en lot."
# Les endpoints batch n'acceptent que l'authentification Microsoft Entra ID.
auth_mode: aad_token
