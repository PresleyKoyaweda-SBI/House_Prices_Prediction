name: ml-project-training
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Aligné sur pyproject.toml (pip-audit : mlflow 2.16.2 concerné par de
      # nombreux CVE, corrigés à partir de 3.15.0 ; épinglé exactement, c'est
      # le plafond mlflow-skinny<=3.15.0 de azureml-mlflow==1.62.0.post6).
      - mlflow==3.15.0
      # Aligné sur pyproject.toml — 1.57.* exige azure-storage-blob<=12.19.0,
      # incompatible avec azure-storage-blob==12.22.* (voir pyproject.toml).
      - azureml-mlflow==1.62.*
      - scikit-learn==1.5.*
      - pandas==2.2.*
      # Épinglé exactement (pas de wildcard) : le correctif de PYSEC-2026-113
      # (pip-audit, 17.0.0 concerné) n'arrive qu'à 23.0.1 — "23.0.*"
      # résoudrait potentiellement vers 23.0.0, sans le correctif.
      - pyarrow==23.0.1
      - numpy==1.26.*
      # Modèle retenu dans notebooks/01_Exploration.ipynb, entraîné par
      # components/train — aligné sur pyproject.toml. (lightgbm n'est utile
      # qu'au notebook, qui tourne en local : il reste dans pyproject.toml.)
      - xgboost==3.2.*
      # cloudpickle 2.x OBLIGATOIRE (ne pas monter en 3.x) : le modèle est
      # sérialisé avec cloudpickle, et MLflow fige la version installée ici
      # dans les dépendances du modèle. Au déploiement batch, Azure ML y ajoute
      # azureml-dataset-runtime, dont la dépendance azureml-dataprep exige
      # cloudpickle<3.0.0 : avec cloudpickle 3.x, pip ne trouve aucune
      # combinaison valide et la construction de l'image de scoring échoue
      # (constaté sur un déploiement réel). Aligné sur pyproject.toml.
      - cloudpickle==2.2.1
      # joblib (dépendance de scikit-learn) exige cloudpickle>=3.0 à partir de
      # 1.6.0 : je fige la dernière version compatible avec cloudpickle 2.x.
      - joblib==1.5.3
      # Pas de SDK Azure ML (azure-ai-ml, azure-identity) : aucun composant ne
      # l'appelle (le modèle est enregistré par scripts/bootstrap-project.sh). Le
      # SDK reste dans pyproject.toml pour les tests d'intégration et smoke,
      # qui tournent en local ou en CI.
