# TEMPLATE: optional
# ------------------------------------------------------------------------
# Exemple de cluster de calcul Azure ML (AmlCompute) avec autoscaling et
# arrêt automatique à zéro nœud. Optionnel : un compute serverless
# (`az ml job create` sans compute déclaré, ou `compute: azureml:serverless`
# dans un job/pipeline) évite de gérer un cluster dédié pour la plupart des
# charges de travail d'entraînement ponctuelles.
#
# Référence Microsoft officielle :
# https://learn.microsoft.com/azure/machine-learning/how-to-create-attach-compute-cluster
#
# Création :
#   az ml compute create --file ml/compute/compute-cluster.yml \
#     --resource-group <rg> --workspace-name <workspace>
#
# Accès aux images Docker de l'ACR, selon le mode choisi dans les tfvars :
# - Sans RBAC (enable_rbac_assignments = false, ACR admin_enabled = true,
#   configuration actuelle de dev et prod) : Azure ML récupère les images
#   avec le compte admin de l'ACR. Aucun rôle à attribuer, donc aucun besoin
#   d'un Owner sur le resource group.
# - Avec RBAC (ACR sans compte admin) : AmlCompute récupère les images avec
#   SA PROPRE identité managée, pas celle du workspace (constaté sur un test
#   réel). Il faut alors accorder AcrPull à cette identité, une fois par
#   cluster (fait par scripts/bootstrap-project.sh si tu en as le droit) :
#     az role assignment create --assignee-object-id <principal_id du compute> \
#       --assignee-principal-type ServicePrincipal --role AcrPull \
#       --scope <id de l'ACR>
# Aucun autre rôle n'est nécessaire : register_model n'appelle pas le SDK
# Azure ML (le modèle est enregistré après le pipeline par
# scripts/bootstrap-project.sh, avec l'identité de celui qui le lance).
# `identity: system_assigned` reste déclaré pour le mode RBAC.
$schema: https://azuremlschemas.azureedge.net/latest/amlCompute.schema.json
name: cpu-cluster
type: amlcompute
# Dimensionné sur la charge mesurée (run local sur les 20 640 districts) :
# data_prep ~8 s, train ~50 s, evaluate ~16 s, moins de 350 Mo de RAM par
# étape. Standard_DS3_v2 (4 vCPU, 14 Go) laisse une large marge mémoire, et
# ses 4 cœurs servent à XGBoost (n_jobs=-1 dans train). Une VM plus petite
# n'économiserait que quelques centimes par run : le cluster est facturé à la
# minute et redescend à zéro nœud.
size: Standard_DS3_v2
min_instances: 0
# Les étapes du pipeline s'enchaînent : un run n'occupe qu'un nœud. 2 nœuds
# permettent un réentraînement et un scoring batch (batch-deployment.yml) en
# parallèle, en plafonnant la dépense en cas de soumissions multiples.
max_instances: 2
# 5 min : le nœud reste chaud entre deux étapes du pipeline, ce qui évite de
# payer plusieurs minutes de démarrage de VM à chaque étape.
idle_time_before_scale_down: 300
# Pas d'accès SSH aux nœuds : aucun besoin pour des jobs batch, et une surface
# d'attaque de moins (activé par défaut par Azure ML).
ssh_public_access_enabled: false
identity:
  type: system_assigned
