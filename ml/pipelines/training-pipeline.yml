# TEMPLATE: customize for client
# ------------------------------------------------------------------------
# Pipeline d'entraînement générique : data_prep → train → evaluate →
# register_model. Le YAML orchestre uniquement l'enchaînement des
# composants ; toute la logique ML vit dans components/*/src/main.py.
#
# Référence Microsoft officielle :
# https://learn.microsoft.com/azure/machine-learning/how-to-create-component-pipelines-cli
#
# Soumission :
#   az ml job create --file ml/pipelines/training-pipeline.yml \
#     --resource-group <rg> --workspace-name <workspace>
$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: training-pipeline
description: "Pipeline d'entraînement de bout en bout — valeur médiane des logements par district (California Housing)."

# Compute par défaut du pipeline (voir ml/compute/compute-cluster.yml). Je
# garde un cluster dédié plutôt que le serverless : le endpoint batch
# (batch-deployment.yml) et train-standalone-job.yml en ont besoin de toute
# façon.
settings:
  default_compute: azureml:cpu-cluster

inputs:
  raw_data:
    type: uri_folder
    path: azureml:house-prices-raw-data@latest
  test_size: 0.2
  # Seuils d'acceptabilité du notebook (introduction) : au-delà, le modèle
  # n'est pas enregistré et le pipeline apparaît en échec.
  # RMSE maximale : 0.5 = 50 000 $ d'écart typique par district.
  rmse_threshold: 0.5
  # MAPE maximale, en % de la valeur réelle d'un district.
  mape_threshold_pct: 20

jobs:
  data_prep_job:
    type: command
    component: ../../components/data_prep/component.yml
    inputs:
      raw_data: ${{parent.inputs.raw_data}}
      test_size: ${{parent.inputs.test_size}}
    outputs:
      train_data:
      test_data:

  train_job:
    type: command
    component: ../../components/train/component.yml
    inputs:
      train_data: ${{parent.jobs.data_prep_job.outputs.train_data}}
    outputs:
      model_output:

  evaluate_job:
    type: command
    component: ../../components/evaluate/component.yml
    inputs:
      model_input: ${{parent.jobs.train_job.outputs.model_output}}
      test_data: ${{parent.jobs.data_prep_job.outputs.test_data}}
    outputs:
      evaluation_report:

  register_model_job:
    type: command
    component: ../../components/register_model/component.yml
    inputs:
      model_input: ${{parent.jobs.train_job.outputs.model_output}}
      evaluation_report: ${{parent.jobs.evaluate_job.outputs.evaluation_report}}
      rmse_threshold: ${{parent.inputs.rmse_threshold}}
      mape_threshold_pct: ${{parent.inputs.mape_threshold_pct}}
    # Modèle accepté par le gate. Déclarer un `name` suffit : Azure ML
    # l'enregistre lui-même dans le registre (nouvelle version à chaque run
    # réussi) quand l'étape se termine. Aucun appel au SDK depuis le code,
    # donc aucun rôle Azure à accorder à l'identité du compute.
    # `type` et `name` sont déclarés ICI, sur la sortie de l'étape : déclarés
    # sur une sortie de pipeline, le modèle a été enregistré en CUSTOM au lieu
    # de MLFLOW (constaté sur un run réel), et le déploiement batch sans code
    # exige un modèle MLFLOW.
    outputs:
      model_output:
        type: mlflow_model
        name: house-price-model
