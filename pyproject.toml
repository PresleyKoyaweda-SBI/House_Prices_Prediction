[build-system]
# >=83.0.0 : setuptools<83 est concerné par PYSEC-2026-3447 (pip-audit).
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

# Pas de package Python à construire ici (components/*/src sont packagés à
# part pour Azure ML CLI v2, voir docs/TROUBLESHOOTING.md) — ce pyproject.toml
# ne sert qu'à déclarer les dépendances / extras "dev". Sans ça, `pip install
# -e ".[dev]"` échoue en CI : setuptools détecte plusieurs dossiers top-level
# (ml, notebooks, components, ...) et refuse de deviner lequel packager.
[tool.setuptools]
py-modules = []

[project]
name = "azure-ml-starter-kit"
version = "1.0.0"
description = "Starter kit Azure ML CLI v2 / SDK v2 réutilisable — composants, pipelines, infrastructure Terraform."
requires-python = ">=3.11"
readme = "README.md"

# TEMPLATE: customize for client — dépendances Python minimales communes aux
# composants (components/*/src) et aux outils (tools/). Ajouter les
# bibliothèques spécifiques au cas d'usage client au besoin.
dependencies = [
    "numpy==1.26.*",
    "pandas==2.2.*",
    "scikit-learn==1.5.*",
    # Épinglé exactement (pas de wildcard) : le correctif de PYSEC-2026-113
    # (pip-audit, 17.0.0 concerné) n'arrive qu'à 23.0.1 — "23.0.*" résoudrait
    # potentiellement vers 23.0.0, qui n'a PAS le correctif. pandas==2.2.*
    # n'impose aucun plafond sur pyarrow (Requires-Dist: pyarrow>=10.0.1),
    # vérifié sans risque de conflit.
    "pyarrow==23.0.1",
    "pyyaml==6.0.*",
    # mlflow 2.16.2 est concerné par ~35 CVE (pip-audit), corrigés seulement à
    # partir de 3.15.0 pour les plus récents — impossible de rester sur la
    # branche 2.x. Épinglé exactement à 3.15.0 (pas de wildcard) : c'est le
    # plafond exact de azureml-mlflow==1.62.0.post6 (mlflow-skinny<=3.15.0,
    # vérifié via ses métadonnées PyPI) ; une version mlflow plus récente
    # romprait cette contrainte. Testé réellement (pipeline data_prep→train→
    # evaluate) avec mlflow 3.15.2 dans cette session — mlflow.autolog(),
    # mlflow.sklearn.save_model/load_model et mlflow.log_metrics inchangés.
    "mlflow==3.15.0",
    # azureml-mlflow==1.57.* exige azure-storage-blob<=12.19.0 — incompatible
    # avec le azure-storage-blob==12.22.* ci-dessous ("ResolutionImpossible"
    # constaté en CI). 1.62.* autorise azure-storage-blob<=12.27.1 (vérifié :
    # métadonnées PyPI de azureml-mlflow 1.62.0) — aligné sur
    # ml/environments/conda.yml pour éviter toute dérive entre les deux.
    "azureml-mlflow==1.62.*",
    # azure-ai-ml==1.19.* casse à l'import ("ImportError: cannot import
    # name '_T' from 'marshmallow.fields'", voir docs/TROUBLESHOOTING.md) —
    # 1.34.* est la version vérifiée compatible, alignée sur
    # ml/environments/conda.yml (l'environnement réellement utilisé par les
    # composants sur Azure ML).
    "azure-ai-ml==1.34.*",
    "azure-identity==1.25.*",
    "azure-storage-blob==12.22.*",
    "azure-keyvault-secrets==4.8.*",
    # Modèles de boosting utilisés par components/train (modèle retenu dans
    # notebooks/01_Exploration.ipynb) — alignés sur ml/environments/conda.yml.
    "lightgbm==4.7.*",
    "xgboost==3.2.*",
    # cloudpickle 2.x obligatoire : même version que l'environnement Azure ML
    # (ml/environments/conda.yml), dont le commentaire explique pourquoi
    # (conflit avec azureml-dataprep, qui exige cloudpickle<3.0.0, au
    # déploiement batch). mlflow 3.15 accepte cloudpickle<4.
    "cloudpickle==2.2.1",
    # joblib >= 1.6.0 exige cloudpickle>=3.0 : dernière version compatible.
    "joblib==1.5.3",
]

# `cryptography` (transitive, via azure-identity) reste non épinglé et donc
# potentiellement concerné par PYSEC-2026-3552 (pip-audit — corrigé en
# 50.0.0) : impossible de forcer >=50.0.0 sans casser mlflow==3.15.0, qui
# exige explicitement cryptography<50,>=43.0.0 ("ResolutionImpossible"
# constaté en local). La CVE ne touche que le déchiffrement PKCS#7/S-MIME
# (pkcs7_decrypt_der/pem/smime), jamais utilisé dans ce repo — exclusion
# documentée dans .github/workflows/ci.yml (pip-audit --ignore-vuln).

[project.optional-dependencies]
dev = [
    # Épinglé exactement (pas de wildcard) : le correctif de PYSEC-2026-1845
    # (pip-audit, 8.3.5 concerné) n'arrive qu'à 9.0.3 — "9.0.*" résoudrait
    # potentiellement vers 9.0.0/9.0.1/9.0.2, sans le correctif.
    # pytest-cov==5.0.* n'impose aucun plafond (Requires-Dist: pytest>=4.6).
    "pytest==9.0.3",
    "pytest-cov==5.0.*",
    "ruff==0.6.*",
    "mypy==1.11.*",
    # 2.33.0 : 2.32.5 est concerné par PYSEC-2026-2275 (pip-audit).
    "requests==2.33.*",
    # Le plancher [build-system].requires ne force pas la version installée
    # dans l'environnement final (setuptools n'est pas une dépendance projet
    # tant qu'il n'est pas listé ici) — sans cette ligne, pip installe la
    # version ambiante du runner (79.0.1, concernée par PYSEC-2026-3447).
    "setuptools>=83.0.0",
    # Stubs requis par mypy pour tools/validate_yaml.py (pyyaml n'embarque
    # pas ses propres annotations de type) — sinon "Library stubs not
    # installed for 'yaml'".
    "types-PyYAML",
]
notebooks = [
    "jupyter==1.0.*",
    # Exploration / sélection de modèle (notebooks/01_Exploration.ipynb).
    "python-dotenv==1.*",
    "seaborn==0.13.*",
    "statsmodels==0.15.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
# Requis : chaque components/*/src/main.py partage le même nom de module
# ("main"), sans __init__.py (packaging Azure ML CLI v2 — voir
# docs/TROUBLESHOOTING.md).
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
# Requis : plusieurs components/*/tests/test_component.py partagent le même
# nom de module. `importlib` évite les collisions d'import entre eux
# (voir docs/TROUBLESHOOTING.md).
addopts = "--import-mode=importlib"
testpaths = ["components", "tests"]
